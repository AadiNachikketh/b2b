name: Deploy Vite SaaS Platform to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify pre-compiled static bundle & entrypoints
        run: |
          test -f index.html
          test -f 404.html
          test -f static-dist/app.js
          test -f static-dist/app.css
          echo "Static bundle verified for GitHub Pages deployment."
